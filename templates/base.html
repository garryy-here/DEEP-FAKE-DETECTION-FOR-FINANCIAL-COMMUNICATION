<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinShield AI - DeepFake Detection{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-shield-halved"></i>
            <span class="brand-text">FinShield<span class="brand-ai">AI</span></span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a href="/analyze" class="nav-link {% if request.endpoint == 'analyze' %}active{% endif %}">
                <i class="fas fa-magnifying-glass"></i> Analyze
            </a>
            <a href="/api/demo/run-all" class="nav-link" target="_blank">
                <i class="fas fa-flask"></i> Run Demo
            </a>
        </div>
        <div class="nav-status">
            <span class="status-indicator online"></span>
            <span>System Active</span>
        </div>
    </nav>

    <main class="main-content">
        {% if error %}
        <div class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 FinShield AI — DeepFake Detection for Financial Communication | Hackathon Project</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
